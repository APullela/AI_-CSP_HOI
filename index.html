<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary & Decimal Practice Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: block;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .prompt-box {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .text-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .feedback {
            text-align: center;
            font-weight: 600;
            min-height: 24px;
            margin-bottom: 15px;
        }

        .feedback.correct {
            color: var(--success-color);
        }

        .feedback.incorrect {
            color: var(--error-color);
        }

        /* Converter mode styles */
        .converter-row {
            margin-bottom: 20px;
        }

        .converter-row label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Binary Practice Hub</h1>
        <div class="subtitle">Practice binary/decimal conversions and test your skills!</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchMode('quiz')">Quiz Mode</button>
            <button class="tab-btn" onclick="switchMode('converter')">Live Converter</button>
        </div>

        <!-- QUIZ MODE -->
        <div id="quiz-mode" class="mode-section active">
            <div class="quiz-header">
                <span id="streak-tracker">Streak: 0</span>
                <span id="score-tracker">Score: 0</span>
            </div>

            <div id="prompt-box" class="prompt-box">
                Convert Decimal 42 to Binary:
            </div>

            <div class="input-group">
                <input type="text" id="user-answer" class="text-input" placeholder="Type your answer..." autocomplete="off">
                <button id="submit-btn" class="action-btn">Submit</button>
            </div>

            <div id="feedback" class="feedback"></div>
        </div>

        <!-- LIVE CONVERTER MODE -->
        <div id="converter-mode" class="mode-section">
            <div class="converter-row">
                <label for="dec-input">Decimal (Base 10)</label>
                <input type="number" id="dec-input" class="text-input" placeholder="Enter decimal number..." oninput="convertFromDecimal()">
            </div>
            <div class="converter-row">
                <label for="bin-input">Binary (Base 2)</label>
                <input type="text" id="bin-input" class="text-input" placeholder="Enter binary number (0s and 1s)..." oninput="convertFromBinary()">
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.mode-section').forEach(sec => sec.classList.remove('active'));
            
            if (mode === 'quiz') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('quiz-mode').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('converter-mode').classList.add('active');
            }
        }

        // Quiz Mode Logic
        let currentTarget = 0;
        let isDecimalToBinary = true;
        let score = 0;
        let streak = 0;

        const promptBox = document.getElementById('prompt-box');
        const userAnswer = document.getElementById('user-answer');
        const submitBtn = document.getElementById('submit-btn');
        const feedback = document.getElementById('feedback');
        const streakTracker = document.getElementById('streak-tracker');
        const scoreTracker = document.getElementById('score-tracker');

        function generateQuestion() {
            feedback.textContent = '';
            userAnswer.value = '';
            isDecimalToBinary = Math.random() < 0.5;
            currentTarget = Math.floor(Math.random() * 255) + 1; // 1 to 255

            if (isDecimalToBinary) {
                promptBox.textContent = `Convert Decimal ${currentTarget} to Binary:`;
            } else {
                const binStr = currentTarget.toString(2);
                promptBox.textContent = `Convert Binary ${binStr} to Decimal:`;
            }
        }

        function checkAnswer() {
            const val = userAnswer.value.trim();
            if (!val) return;

            let correctVal = isDecimalToBinary ? currentTarget.toString(2) : currentTarget.toString(10);

            if (val === correctVal) {
                feedback.textContent = 'Correct! Great job.';
                feedback.className = 'feedback correct';
                score += 10;
                streak += 1;
                scoreTracker.textContent = `Score: ${score}`;
                streakTracker.textContent = `Streak: ${streak}`;
                setTimeout(generateQuestion, 1200);
            } else {
                feedback.textContent = `Incorrect. The correct answer was ${correctVal}.`;
                feedback.className = 'feedback incorrect';
                streak = 0;
                streakTracker.textContent = `Streak: ${streak}`;
                setTimeout(generateQuestion, 2000);
            }
        }

        submitBtn.addEventListener('click', checkAnswer);
        userAnswer.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        // Live Converter Logic
        function convertFromDecimal() {
            const decVal = document.getElementById('dec-input').value;
            const binField = document.getElementById('bin-input');
            if (decVal === '' || isNaN(decVal)) {
                binField.value = '';
                return;
            }
            binField.value = parseInt(decVal, 10).toString(2);
        }

        function convertFromBinary() {
            const binVal = document.getElementById('bin-input').value.trim();
            const decField = document.getElementById('dec-input');
            if (!/^[01]+$/.test(binVal)) {
                if (binVal !== '') decField.value = 'Invalid Binary';
                else decField.value = '';
                return;
            }
            decField.value = parseInt(binVal, 2);
        }

        // Initialize Quiz
        generateQuestion();
    </script>
</body>
</html>
